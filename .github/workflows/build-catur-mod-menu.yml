name: Build Catur Mod Menu

on:
  push:
    paths:
      - 'catur-mod-menu/**'
      - '.github/workflows/build-catur-mod-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catur-mod-menu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Fetch Stockfish engine (arm64, NNUE embedded)
        run: |
          set -e
          mkdir -p app/src/main/assets/engine
          curl -L --fail --retry 3 --retry-delay 3 \
            -o /tmp/stockfish.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz
          mkdir -p /tmp/stockfish
          tar -xzf /tmp/stockfish.tar.gz -C /tmp/stockfish
          cp /tmp/stockfish/stockfish/stockfish-android-arm64-universal \
             app/src/main/assets/engine/stockfish
          chmod 755 app/src/main/assets/engine/stockfish
          ls -lh app/src/main/assets/engine/stockfish

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: catur-mod-menu-debug
          path: catur-mod-menu/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
