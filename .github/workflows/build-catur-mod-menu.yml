name: Build Catur Mod Menu

on:
  push:
    paths:
      - 'catur-mod-menu/**'
      - '.github/workflows/build-catur-mod-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catur-mod-menu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Bundle Stockfish as native library
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 3 --retry-delay 3 \
            -o /tmp/stockfish.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz
          mkdir -p /tmp/stockfish
          tar -xzf /tmp/stockfish.tar.gz -C /tmp/stockfish
          cp /tmp/stockfish/stockfish/stockfish-android-arm64-universal \
             app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Generate release keystore
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias catur -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass caturmodmenu -keypass caturmodmenu \
            -dname "CN=Catur Mod Menu, OU=ofx, O=Catur, L=Kitchen, ST=Kitchen, C=ID" >/dev/null
          ls -lh app/release.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/catur-mod-menu/app/release.keystore
          KEYSTORE_PASSWORD: caturmodmenu
          KEYSTORE_ALIAS: catur
          KEY_PASSWORD: caturmodmenu
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: catur-mod-menu-release
          path: catur-mod-menu/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Catur Mod Menu v1.0.0
          files: catur-mod-menu/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          generate_release_notes: false
          body: |
            Signed, installable APK. Download `app-release.apk` directly — no ZIP extraction needed.
            First launch downloads the Stockfish engine (~80 MB) once, then works offline.
