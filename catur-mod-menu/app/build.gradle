plugins {
    id 'com.android.application'
}

android {
    namespace 'com.catur.modmenu'
    compileSdk 35

    defaultConfig {
        applicationId 'com.catur.modmenu'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "caturmodmenu"
            keyAlias System.getenv("KEYSTORE_ALIAS") ?: "catur"
            keyPassword System.getenv("KEY_PASSWORD") ?: "caturmodmenu"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // Stockfish ships as an executable native lib and must be unpacked to
        // nativeLibraryDir so execve() is permitted on Android 10+.
        jniLibs { useLegacyPackaging = true }
        exclude 'META-INF/*'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
